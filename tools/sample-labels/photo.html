<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }
  #scene { position: relative; overflow: hidden; }
  #bottle { position: absolute; top: -4%; bottom: -4%; border-radius: 48% 48% 10% 10% / 8% 8% 3% 3%; }
  #wrap { position: absolute; transform-style: preserve-3d; }
  #wrap canvas { display: block; box-shadow: 0 6px 30px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="scene"><div id="bottle"></div><div id="wrap"></div></div>
<script>
// Builds a fake "photo" of a flat label: wraps it around a bottle (cylindrical
// projection), adds glare, places it in a scene and applies camera effects.
async function loadImage(src) {
  const img = new Image();
  img.src = src;
  await img.decode();
  return img;
}

window.makePhoto = async ({ src, o }) => {
  const img = await loadImage(src);
  const W = img.naturalWidth, H = img.naturalHeight;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');

  if (o.curve) {
    // Cylinder: output column u shows source column at angle asin(x * sin(tmax)).
    const tmax = o.curve, s = Math.sin(tmax);
    for (let u = 0; u < W; u++) {
      const xn = ((u + 0.5) / W) * 2 - 1;
      const th = Math.asin(xn * s);
      const sx = Math.min(W - 1, Math.max(0, ((th / tmax + 1) / 2) * W));
      c.drawImage(img, sx, 0, 1, H, u, 0, 1, H);
    }
    const g = c.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.5)');
    g.addColorStop(0.18, 'rgba(0,0,0,0.1)');
    g.addColorStop(0.45, 'rgba(0,0,0,0)');
    g.addColorStop(0.78, 'rgba(0,0,0,0.08)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
  } else {
    c.drawImage(img, 0, 0);
  }

  if (o.glare) {
    const { x, y, rx, ry, a } = o.glare;
    c.save();
    c.translate(x * W, y * H);
    c.scale(rx * W, ry * H);
    const gg = c.createRadialGradient(0, 0, 0, 0, 0, 1);
    gg.addColorStop(0, `rgba(255,255,255,${a})`);
    gg.addColorStop(0.5, `rgba(255,255,255,${a * 0.6})`);
    gg.addColorStop(1, 'rgba(255,255,255,0)');
    c.globalCompositeOperation = 'screen';
    c.fillStyle = gg;
    c.beginPath();
    c.arc(0, 0, 1, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  const scene = document.getElementById('scene');
  const bottle = document.getElementById('bottle');
  const wrap = document.getElementById('wrap');
  const pad = o.scene ? Math.round(W * 0.16) : 0;
  const SW = W + pad * 2, SH = H + pad * 2;
  scene.style.width = SW + 'px';
  scene.style.height = SH + 'px';
  scene.style.background = {
    wood: 'repeating-linear-gradient(95deg,#6b4a2b 0 18px,#5d3f24 18px 30px,#74512f 30px 52px)',
    dark: 'radial-gradient(ellipse at 50% 45%,#3a3a3a 0%,#121212 75%)',
    light: 'linear-gradient(180deg,#e9edf0 0%,#c9d0d6 100%)',
  }[o.scene] || '#000';
  if (o.bottle) {
    bottle.style.left = pad - W * 0.06 + 'px';
    bottle.style.width = W * 1.12 + 'px';
    bottle.style.background = `linear-gradient(90deg, rgba(0,0,0,.55), ${o.bottle} 20%, ${o.bottle} 70%, rgba(255,255,255,.25) 82%, ${o.bottle} 88%, rgba(0,0,0,.6))`;
  } else {
    bottle.style.display = 'none';
  }
  wrap.style.left = pad + 'px';
  wrap.style.top = pad + 'px';
  wrap.innerHTML = '';
  wrap.appendChild(cv);
  const t = [];
  if (o.rotateX || o.rotateY) t.push(`perspective(${Math.round(W * 1.6)}px)`, `rotateX(${o.rotateX || 0}deg)`, `rotateY(${o.rotateY || 0}deg)`);
  if (o.rotate) t.push(`rotate(${o.rotate}deg)`);
  wrap.style.transform = t.join(' ');
  const f = [];
  if (o.blur) f.push(`blur(${o.blur}px)`);
  if (o.brightness) f.push(`brightness(${o.brightness})`);
  if (o.contrast) f.push(`contrast(${o.contrast})`);
  scene.style.filter = f.join(' ');
  return { width: SW, height: SH };
};

// Final pass on the screenshot: scale, rotate 90°, sensor noise, JPEG encode.
window.finalize = async ({ src, o }) => {
  const img = await loadImage(src);
  const scale = o.scale || 1;
  let w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const cv = document.createElement('canvas');
  const rot = !!o.rotate90;
  cv.width = rot ? h : w;
  cv.height = rot ? w : h;
  const c = cv.getContext('2d');
  c.imageSmoothingQuality = 'high';
  if (rot) {
    c.translate(cv.width, 0);
    c.rotate(Math.PI / 2);
  }
  c.drawImage(img, 0, 0, w, h);
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (o.noise) {
    const d = c.getImageData(0, 0, cv.width, cv.height);
    let seed = 1234567;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    for (let i = 0; i < d.data.length; i += 4) {
      const n = (rnd() + rnd() + rnd() - 1.5) * o.noise * 1.4;
      d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n;
    }
    c.putImageData(d, 0, 0);
  }
  return cv.toDataURL('image/jpeg', (o.jpeg || 90) / 100);
};
</script>
</body>
</html>
